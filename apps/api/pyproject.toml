[project]
name = "case-pilot-api"
version = "0.1.0"
description = "CasePilot API — modular-monolith FastAPI backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.70",
]
