[project]
name = "case-pilot-api"
version = "0.1.0"
description = "CasePilot API — modular-monolith FastAPI backend"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "machadojoy", email = "73057972+machadojoy@users.noreply.github.com" },
]
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Turn on a hard gate once the suite matures, e.g.:
# fail_under = 80

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting — Ruff's built-in isort, no separate tool needed)
    "N",     # pep8-naming
    "UP",    # pyupgrade (modern syntax)
    "B",     # flake8-bugbear (likely bugs)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async (async/await correctness — matters for FastAPI)
    "RUF",   # Ruff-specific rules
    "FAST",  # FastAPI-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["app"]     # our own package -> its own import group
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]            # allow bare `assert` in tests
