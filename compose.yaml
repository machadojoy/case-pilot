# Local development infrastructure for CasePilot.
# Currently just PostgreSQL — the app itself runs on the host via `uv run fastapi dev`
# (fastest inner loop) and connects to this DB on localhost:5432.
#
# Usage:
#   docker compose up -d        # start Postgres in the background
#   docker compose ps           # status / health
#   docker compose logs -f postgres
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop AND wipe the data volume
#
# Config values come from the root `.env` file (see `.env.example`).
name: casepilot

services:
  postgres:
    image: postgres:17
    container_name: casepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — publish 5432 so the host-run app can reach it.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume = data survives `docker compose down` (but not `down -v`).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits for this before reporting the service "healthy".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
