name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL service so tests run against a real DB (dev/prod parity).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: casepilot
          POSTGRES_PASSWORD: casepilot
          POSTGRES_DB: casepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casepilot -d casepilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://casepilot:casepilot@localhost:5432/casepilot
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests (with coverage)
        run: uv run pytest
